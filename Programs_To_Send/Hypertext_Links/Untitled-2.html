<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Page</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body style="background-color: #f8f9fa;"> <!-- Light background -->

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-danger">
        <div class="container">
            <a class="navbar-brand" href="#">Tasty Bites</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Menu</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <!-- Image -->
        <div class="text-center">
            <img src="https://wallpaperaccess.com/full/4834831.jpg" class="img-fluid rounded" alt="Restaurant Image">
        </div>

        <!-- Menu Table -->
        ad>
            <tbody>
                <tr>
                    <td>Paneer Butter Masala</td>
                    <td>₹250</td>
                </tr>
                <tr>
                    <td>Veg Biryani</td>
                    <td>₹180</td>
                </tr>
            </tbody>
        </table>
        
        
        <h3 class="mt-3">Menu</h3>
        <table class="table table-bordered">
            <thead class="table-danger">
                <tr>
                    <th>Dish</th>
                    <th>Price</th>
                </tr>
            </the

        <!-- Popular Items -->
        <h4 class="mt-3">Popular Items</h4>
        <ul class="list-group">
            <li class="list-group-item">Pizza</li>
            <li class="list-group-item">Pasta</li>
            <li class="list-group-item">Mango Smoothie</li>
        </ul>

        <!-- Order Section -->
        <div class="mt-4">
            <h4>Order Now</h4>
            <label for="dishSelect">Select a dish:</label>
            <select class="form-select" id="dishSelect">
                <option>Paneer Butter Masala</option>
                <option>Veg Biryani</option>
                <option>Pizza</option>
            </select>

            <button class="btn btn-success mt-3">Place Order</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
