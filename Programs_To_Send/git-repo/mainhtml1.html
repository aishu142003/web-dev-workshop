<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            flex-direction: column;
            min-height: 50vh;
            font-family: Arial, sans-serif;
            text-align: center;
            background-image: url(img.jpeg);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        header {
            padding: 50px;
            background-color: rgb(149, 195, 195);
            background-image: url(img2.jpeg);
            background-size: 10% 100%;
        }

        main {
            flex: 1;
            padding: 50px;
        }

        .float {
            font-size: 6rem;
            font-weight: bold;
            animation: float 3s infinite alternate;
        }

        h2 {
            font-size: 3rem;
            margin: 30px 0;
        }

        input[type="submit"] {
            font-size: 1.6rem;
            padding: 10px 20px;
            background-color: rgb(8, 7, 47);
            color: rgb(255, 90, 90);
            border: none;
            cursor: pointer;
            border-radius: 100px;
        }

        input[type="submit"]:hover {
            background-color: #5250eb;
        }

        @keyframes float {
            from { transform: translateY(0px); }
            to { transform: translateY(-20px); }
        }

        footer {
            background-color: #1de964;
            padding: 10px;
        }

        footer nav {
            display: flex;
            justify-content: space-evenly;
            gap:100px;
            flex-wrap: wrap;
        }

        footer a {
            color: black;
            text-decoration: none;
            font-weight: bold;
        }

        footer a:hover {
            text-decoration: unset;
        }
    </style>
</head>
<body>
    <header></header>

    <main>
        <p class="float">Welcome to AMAZON</p>
        <form method="post" action="loginhtml.html" target="_blank">
            <h2>For Books</h2>
            <input type="submit" value="Click Here">
        </form>
    </main>

    <footer>
        <nav>
            <a href="#">FAQ</a>
            <a href="#">Terms of Use</a>
            <a href="#">Privacy Policy</a>
            <a href="#">Feedback</a>
            <a href="#">Contact Us</a>
        </nav>
    </footer>
</body>
</html>
