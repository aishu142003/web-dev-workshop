<script>
    let bookPrices = {
        "C&Ds": 500,
        "WebDev": 600,
        "Java": 700,
        "Oracle": 800,
        "Ms SQL Server": 900,
        "MySql": 1000,
        "Percu Jackson": 550,
        "Spirit Run ": 700,
        "The Girl who stole the elephant": 650,
        "The Secret Dragon": 800
    };

    function updateBookImage() {
        let select = document.getElementById("bookSelect");
        let selectedOption = select.options[select.selectedIndex];
        let bookImage = document.getElementById("bookImage");
        let priceInput = document.getElementById("price");

        let imageSrc = selectedOption.getAttribute("data-img");
        let bookName = selectedOption.value;

        if (imageSrc) {
            bookImage.src = imageSrc;
        } else {
            bookImage.src = "";
        }

        // Set price based on book selection
        priceInput.value = bookPrices[bookName] || 0;
        calculateTotal();
    }

    function calculateTotal() {
        let price = document.getElementById("price").value;
        let quantity = document.getElementById("q").value;
        let totalCost = (price * quantity) + 100; // Adding shipping cost
        document.getElementById("total").value = totalCost;
        
        // Update hidden input in the form
        document.getElementById("hiddenTotal").value = totalCost;
    }
    function redirectToPayment() {
        let totalCost = document.getElementById("total").value;
        window.location.href = "paymenthtml.html?totalAmount=" + totalCost;
    }
</script>
    
    
<body bgcolor="lightgreen">
    <header></header>
<nav>

<main>

                <option value="WebDev" data-img="https://m.media-amazon.com/images/I/71oTUAxrrCL._UF1000,1000_QL80_.jpg">WebDev</option>
                <option value="Java" data-img="https://m.media-amazon.com/images/I/51xiwRkS2oL._AC_UF1000,1000_QL80_.jpg">Java</option>
                <option value="Oracle" data-img="https://m.media-amazon.com/images/I/61+SOJUGh-L._AC_UF1000,1000_QL80_.jpg">Oracle</option>
                <option value="Ms SQL Server" data-img="https://m.media-amazon.com/images/I/817S2A+SPtL._AC_UF1000,1000_QL80_.jpg">Ms SQL Server</option>
                <option value="MySql" data-img="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRe3Inl7puXLXXWmVACs89HjHkMY5qpBwPE2g&s">MySql</option>
                <option value="The Secret Dragon" data-img="ad4.jpg">The Secret Dragon</option>
                <option value="The Girl who stole the elephant" data-img="ad3.jpg">The Girl who stole the elephant</option>

            </optgroup>

<tr>

<tr>

<tr>

<tr>
