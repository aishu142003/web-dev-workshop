<style>
*
{
    
 box-sizing: border-box;
 
}
main {
        flex: 1;
        padding: 50px;
    }
    header{
        padding: 50px;
    background-color: rgb(208, 221, 221);
    background-image: url(img2.jpeg);
    background-size: 10% 100%;
    
    }
h1 {
            font-size: 3rem; 
        }
body {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        margin: 0;
        text-align: center;
        background-image: url(img3.jpeg);
        background-size: cover;  /* Ensures the image covers the whole background */
    background-position: center; /* Centers the image */
    background-repeat: no-repeat; /* Prevents image repetition */
    }
 footer {
     background-color: #4ef318;
     padding: 20px;
     /*align-content:left;*/

 }
 footer a{
     text-align: center;
     padding: 10px;
     position: relative;
     bottom: 0;
     width: 100%;
 }
 
</style>
<script>
    // Function to get query parameter from URL
    function getQueryParam(param) {
        let urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(param);
    }

    // Set total amount from URL parameter
    document.addEventListener("DOMContentLoaded", function () {
        let total = getQueryParam("totalAmount");
        if (total) {
            document.getElementById("totalAmount").value = total;
        }
    });
</script>
<body>
<header></header>
<main>
        <section>
    <center><h1>Payment By Credit Card</h1></center>
    <form method="post" action="orderconfirmhtml.html">
        <br><br><br>
        <table align="center" border="1" width=""50%" height="50%">
            <tr>
                <td><h4>Total Amount</h4></td>
                <td><input type="text" id="totalAmount" name="totalAmount" readonly></td>
            </tr>
            <tr>
                <td><h4>Credit Card Number</h4></td>
                <td><input type="text" name="cardNumber"></td>
            </tr>
            <tr>
                <td></td>
                <td><input type="submit" value="OK"></td>
            </tr>
        </table>
    </form>
    </main>
</section>

</body>
</html>
